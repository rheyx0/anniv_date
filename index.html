<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ede0;
    --bg2: #f1e4d2;
    --card: #fffaf2;
    --ink: #5b4636;
    --muted: #9c8571;
    --pink: #f6b8c8;
    --pink-d: #ee8fa8;
    --pink-l: #fde6ec;
    --px: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "Pixelify Sans", monospace;
    background: var(--bg);
    background-image: repeating-conic-gradient(var(--bg) 0 25%, var(--bg2) 0 50%);
    background-size: 40px 40px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; position: relative; z-index: 1; }
  h1, h2 { font-weight: 600; margin: 0 0 8px; line-height: 1.2; }
  h1 { font-size: clamp(28px, 7vw, 40px); }
  h2 { font-size: clamp(24px, 6vw, 32px); }
  p { line-height: 1.5; }
  [hidden] { display: none !important; }

  /* pixel-notched box */
  .px {
    background: var(--card);
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      var(--px) calc(3 * var(--px)) 0 0 rgba(91, 70, 54, .18);
    margin: var(--px);
  }
  .card { padding: 28px 22px; text-align: center; }

  .pxbtn {
    font: 600 18px "Pixelify Sans", monospace;
    color: var(--ink);
    background: var(--pink);
    border: 0;
    padding: 12px 22px;
    margin: 8px;
    cursor: pointer;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      inset 0 calc(-1 * var(--px)) 0 0 var(--pink-d);
    transition: transform .08s;
  }
  .pxbtn:hover { background: #f8c6d3; }
  .pxbtn:active { transform: translateY(3px); }
  .pxbtn.big { font-size: 22px; padding: 14px 28px; }
  .pxbtn:focus-visible, .toy:focus-visible, .linkbtn:focus-visible { outline: 3px dashed var(--pink-d); outline-offset: 8px; }

  .kicker { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .story { font-family: "Gaegu", cursive; font-size: 22px; margin: 6px auto 4px; max-width: 32ch; }
  .hint { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
  .hint .count { color: var(--pink-d); }

  /* start screen */
  .cats { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-bottom: 14px; }
  .cats svg:nth-child(2) { animation: hop 1.6s steps(2) infinite; }
  .hero p:not(.kicker) { font-family: "Gaegu", cursive; font-size: 22px; max-width: 30ch; margin: 10px auto 18px; }

  /* trail */
  .trail-wrap { position: relative; margin: 6px 4px 28px; padding-top: 34px; }
  .trail { list-style: none; display: flex; justify-content: space-between; margin: 0; padding: 0; position: relative; }
  .trail::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 50%; height: 4px; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, var(--muted) 0 8px, transparent 8px 14px);
  }
  .trail li { width: 28px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .dot { width: 16px; height: 16px; background: var(--card); box-shadow: 0 0 0 4px var(--ink); position: relative; z-index: 1; }
  .trail li.done .dot { background: var(--pink); }
  .trail li.here .dot { background: var(--pink-d); }
  .lbl { position: absolute; top: 26px; white-space: nowrap; font-size: 13px; color: var(--muted); display: none; }
  .trail li.here .lbl { display: block; color: var(--ink); }
  .walker {
    position: absolute; top: 0; width: 28px;
    left: calc(var(--p, 0) * (100% - 28px));
    transition: left .9s steps(9);
  }
  .walker svg { display: block; animation: hop .5s steps(2) infinite; }

  /* scene */
  .scene { text-align: center; }
  .toy {
    background: none; border: 0; padding: 10px; margin: 14px auto 0; cursor: pointer; display: block;
    filter: drop-shadow(4px 6px 0 rgba(91, 70, 54, .15));
  }
  .toy svg { display: block; transform-origin: 50% 100%; }
  .toy.idle svg { animation: idle 2.4s ease-in-out infinite; }
  .toy.go.bounce svg { animation: bounce .35s ease-out; }
  .toy.go.squish svg { animation: squish .45s ease-out; }
  .toy.go.wiggle svg { animation: wiggle .4s ease-out; }

  .photos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 22px; margin: 30px 4px 8px;
  }
  .polaroid {
    background: #fff; padding: 10px 10px 4px; border: 0; cursor: zoom-in; text-align: center;
    box-shadow: 0 0 0 4px var(--ink), 6px 8px 0 4px rgba(91, 70, 54, .15);
    transform: rotate(var(--r, 0deg));
    animation: drop .5s ease-out both; animation-delay: var(--d, 0s);
    font: inherit; color: inherit;
  }
  .polaroid:hover { transform: rotate(0) scale(1.03); transition: transform .2s; }
  .polaroid img, .polaroid .ph { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--pink-l); }
  .polaroid .ph {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    font-size: 13px; color: var(--muted); padding: 10px; word-break: break-all;
    background: repeating-linear-gradient(45deg, var(--pink-l) 0 10px, #fff 10px 20px);
  }
  .polaroid figcaption { font-family: "Gaegu", cursive; font-size: 20px; padding: 8px 2px 6px; }
  .nav { margin-top: 26px; }

  /* ending */
  .letter { text-align: left; padding: 26px 24px; margin-top: 26px; animation: drop .6s ease-out both;
    background: var(--card) repeating-linear-gradient(transparent 0 31px, var(--pink-l) 31px 33px); }
  .letter p { font-family: "Gaegu", cursive; font-size: 22px; margin: 0 0 14px; line-height: 33px; }
  .letter .sign { text-align: right; }
  .again { margin-top: 30px; }
  .again p { font-size: 20px; }
  .final { font-family: "Gaegu", cursive; font-size: 30px; font-weight: 700; color: var(--pink-d); }
  .linkbtn { background: none; border: 0; font: 16px "Pixelify Sans", monospace; color: var(--muted); cursor: pointer; margin-top: 30px; text-decoration: underline dotted; }

  /* overlays & effects */
  .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaters span { position: absolute; bottom: -40px; opacity: .45; animation: floatUp linear infinite; }
  .pop {
    position: fixed; z-index: 30; pointer-events: none; font: 600 22px "Pixelify Sans", monospace; color: var(--pink-d);
    text-shadow: 2px 2px 0 var(--card); transform: translate(-50%, -50%); animation: pop 0.9s ease-out forwards;
  }
  .flash { position: fixed; inset: 0; background: #fff; z-index: 40; pointer-events: none; animation: flash .5s ease-out forwards; }
  .burst { position: fixed; z-index: 35; pointer-events: none; left: 50%; top: 50%; animation: burst 1.2s ease-out forwards; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(91, 70, 54, .75); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .lightbox figure { margin: 0; background: #fff; padding: 12px 12px 6px; box-shadow: 0 0 0 4px var(--ink); max-width: min(92vw, 640px); text-align: center; }
  .lightbox img { max-width: 100%; max-height: 74vh; display: block; margin: 0 auto; }
  .lightbox figcaption { font-family: "Gaegu", cursive; font-size: 22px; padding: 8px 0 4px; }
  .sound { position: fixed; top: 12px; right: 12px; z-index: 20; padding: 6px 10px; font-size: 14px; margin: 4px; }

  @keyframes hop { 50% { transform: translateY(-4px); } }
  @keyframes idle { 50% { transform: translateY(-6px); } }
  @keyframes bounce { 40% { transform: translateY(-18px) scale(1.05); } 70% { transform: translateY(0) scale(1.08, .92); } }
  @keyframes squish { 30% { transform: scale(1.35, .62); } 60% { transform: scale(.88, 1.15); } 80% { transform: scale(1.06, .95); } }
  @keyframes wiggle { 25% { transform: rotate(-10deg); } 50% { transform: rotate(9deg); } 75% { transform: rotate(-5deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px) rotate(var(--r, 0deg)); } to { opacity: 1; transform: rotate(var(--r, 0deg)); } }
  @keyframes pop { to { opacity: 0; transform: translate(-50%, -150%) scale(1.3); } }
  @keyframes flash { from { opacity: .95; } to { opacity: 0; } }
  @keyframes floatUp { to { transform: translateY(-115vh) rotate(20deg); } }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .floaters { display: none; }
  }
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>
<button class="pxbtn sound" id="sound" aria-pressed="true">sound: on</button>

<main>
  <section id="start" class="screen">
    <div class="px card hero">
      <div class="cats" id="heroCats"></div>
      <p class="kicker" id="dateLabel"></p>
      <h1>hi, <span class="her"></span> ♡</h1>
      <p id="intro"></p>
      <button class="pxbtn big" id="startBtn">start our date</button>
    </div>
  </section>

  <section id="journey" class="screen" hidden>
    <div class="trail-wrap" aria-hidden="true">
      <div class="walker" id="walker"></div>
      <ol class="trail" id="trail"></ol>
    </div>
    <div class="px card scene" id="scene"></div>
  </section>

  <section id="ending" class="screen" hidden>
    <div class="px card scene">
      <p class="kicker">last stop</p>
      <h2>goodnight, <span class="her"></span></h2>
      <p class="story">before you go... i left something for you</p>
      <button class="toy idle" id="envelope" aria-label="open the letter"></button>
      <p class="hint" id="envHint">tap to open</p>
      <article class="px letter" id="letter" hidden></article>
      <div class="again" id="again" hidden>
        <p>will you go on another date with me?</p>
        <button class="pxbtn" data-yes>yes</button>
        <button class="pxbtn" data-yes>YES ♡</button>
      </div>
      <p class="final" id="final" hidden>it's a date. see you soon ♡</p>
      <div><button class="linkbtn" id="restart">relive our date ↺</button></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure></div>

<script>
/* =========================================================
   EDIT THIS PART ♡
   - Put your photos in the "photos" folder next to this file
   - Change the text, stops and file names below
   ========================================================= */
const CONFIG = {
  herName: "my love",
  yourName: "your favorite person",
  dateLabel: "a date from miles away",
  intro: "i know we're far apart right now, so i took you with me today. tap through and come on our little date with me.",
  letter: [
    "hi baby,",
    "i wish you were really here with me today. every stop, i kept thinking about what you'd say, what you'd pick, and how you'd laugh at me.",
    "the distance is hard, but dates like this remind me that you're with me everywhere i go. one day we won't need a website for this.",
    "i love you so much.",
  ],
};

// Each stop of the date. sprite: cat, heart, squishy, onigiri, boba, camera
// anim: bounce | squish | wiggle    taps: how many taps before photos appear
// flash: true makes a camera flash on tap
const SCENES = [
  {
    stop: "meet up", title: "first, i come pick you up",
    text: "you look so pretty today. ready to go?",
    sprite: "heart", anim: "bounce", action: "hold my hand", taps: 1, pops: ["♡"],
    photos: [
      { src: "photos/01-meetup.jpg", caption: "on my way to you" },
    ],
  },
  {
    stop: "squishies", title: "squishy hunting",
    text: "you know i can't walk past a squishy shop. this one reminded me of you.",
    sprite: "squishy", anim: "squish", action: "squish it", taps: 3, pops: ["squish!", "squish!!", "SQUISH ♡"],
    photos: [
      { src: "photos/02-squishy-1.jpg", caption: "the shelf of dreams" },
      { src: "photos/02-squishy-2.jpg", caption: "i got us one!" },
    ],
  },
  {
    stop: "food", title: "snack time",
    text: "i saved you a bite, i promise.",
    sprite: "onigiri", anim: "wiggle", action: "take a bite", taps: 3, pops: ["nom", "nom nom", "all gone :3"],
    photos: [
      { src: "photos/03-food-1.jpg", caption: "your share" },
      { src: "photos/03-food-2.jpg", caption: "my share (smaller, for you)" },
    ],
  },
  {
    stop: "boba", title: "boba break",
    text: "brown sugar, less ice, extra pearls. just how you like it.",
    sprite: "boba", anim: "bounce", action: "take a sip", taps: 3, pops: ["slurp", "sluuurp", "pearls!"],
    photos: [
      { src: "photos/04-boba.jpg", caption: "cheers ♡" },
    ],
  },
  {
    stop: "pictures", title: "smile for me",
    text: "one picture together before the day ends.",
    sprite: "camera", anim: "bounce", action: "take a photo", taps: 1, pops: ["click!"], flash: true,
    photos: [
      { src: "photos/05-photo-1.jpg", caption: "us (kind of)" },
      { src: "photos/05-photo-2.jpg", caption: "the sunset i wanted to show you" },
    ],
  },
];

/* ======================= pixel art ======================= */
const PALETTE = {
  k: "#5b4636", w: "#fffaf2", p: "#f6b8c8", r: "#ee8fa8", c: "#f3c6cf",
  l: "#a9c4d6", b: "#e9cfae", g: "#4f6b4a", o: "#e8b07a",
};
const SPRITES = {
  cat: [
    "..k.........k...",
    ".kwk.......kwk..",
    ".kpwk.....kwpk..",
    ".kwwwkkkkkwwwk..",
    ".kwwwwwwwwwwwk..",
    "kwwwwwwwwwwwwwk.",
    "kwwkkwwwwwkkwwk.",
    "kwwkkwwwwwkkwwk.",
    "kwrwwwwkwwwwrwk.",
    "kwwwwwkwkwwwwwk.",
    ".kwwwwwwwwwwwk..",
    "..kkwwwwwwwkk...",
    "...kwwwwwwwk.kk.",
    "...kwwwwwwwkkwk.",
    "...kwkwwwkwkkk..",
    "...kkk.k.kkk....",
  ],
  catOrange: [
    "..k.........k...",
    ".kok.......kok..",
    ".kpok.....kopk..",
    ".koookkkkkoook..",
    ".koowwooowwook..",
    "kooooooooooooook",
    "kookkoooookkook.",
    "kookkoooookkook.",
    "korwwwwkwwwwrok.",
    "kowwwwkwkwwwwok.",
    ".kwwwwwwwwwwwk..",
    "..kkooooooookk..",
    "...kooooooook...",
    "...kwwoooowwk...",
    "...kwkwwwkwk....",
    "...kkk.k.kkk....",
  ],
  heart: [
    ".kk.kk.",
    "kppkppk",
    "kpwpppk",
    "kpppppk",
    ".kpppk.",
    "..kpk..",
    "...k...",
  ],
  squishy: [
    "....kkkkk....",
    "..kkpppppkk..",
    ".kpwwppppppk.",
    "kpwpppppppppk",
    "kppkpppppkppk",
    "kprppppppprpk",
    "kpppppkpppppk",
    "kppppkpkppppk",
    ".kpppppppppk.",
    "..kkkkkkkkk..",
  ],
  onigiri: [
    ".....kk.....",
    "....kwwk....",
    "...kwwwwk...",
    "..kwkwwkwk..",

  boba: [

    ".kbwbbbbbbk.",

  ],
  camera: [
    "..kkkk......",
    "kkkkkkkkkkkk",

    "kccckwwwkcck",
    "kcckwlllwkck",
    "kcckwlwlwkck",

  ],
  envelope: [
    "kkkkkkkkkkkk",

    "kwkwwwwwwkwk",

    "kwwwkppkwwwk",
    "kwwwwkkwwwwk",

    "kkkkkkkkkkkk",
  ],
  paw: [
    ".p.p.",
    "p...p",
    ".ppp.",
    "ppppp",
    ".ppp.",
  ],
};

function sprite(name, size) {
  const rows = SPRITES[name];
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let rects = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (PALETTE[ch]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PALETTE[ch]}"/>`;
  }));
  return `<svg viewBox="0 0 ${w} ${h}" width="${size}" height="${Math.round(size * h / w)}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* ======================= little helpers ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let current = 0, soundOn = true, actx;

function blip(freq = 660, dur = 0.09) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.035, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function melody(notes) { notes.forEach((f, i) => setTimeout(() => blip(f, 0.12), i * 110)); }

function popText(text, x, y) {
  const el = document.createElement("span");
  el.className = "pop"; el.textContent = text;
  el.style.left = x + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function eventPoint(e, el) {
  if (e.clientX || e.clientY) return [e.clientX, e.clientY - 30];
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top];
}
function replay(el) { el.classList.remove("go"); void el.offsetWidth; el.classList.add("go"); }
function flash() {
  const f = document.createElement("div"); f.className = "flash";
  document.body.appendChild(f); setTimeout(() => f.remove(), 550);
}
function heartBurst() {
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("span"); h.className = "burst";
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    h.style.setProperty("--dx", Math.cos(a) * d + "px");
    h.style.setProperty("--dy", Math.sin(a) * d + "px");
    h.innerHTML = sprite(Math.random() < .7 ? "heart" : "paw", 18 + Math.random() * 18);
    document.body.appendChild(h); setTimeout(() => h.remove(), 1250);
  }
}
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ======================= the date ======================= */
function renderTrail() {
  const stops = [...SCENES.map(s => s.stop), "goodnight"];
  $("#trail").innerHTML = stops.map((s, i) =>
    `<li class="${i < current ? "done" : ""} ${i === current ? "here" : ""}"><span class="dot"></span><span class="lbl">${esc(s)}</span></li>`
  ).join("");
  $("#walker").style.setProperty("--p", current / (stops.length - 1));
}

function renderScene() {
  const s = SCENES[current];
  const last = current === SCENES.length - 1;
  $("#scene").innerHTML = `
    <p class="kicker">stop ${current + 1} of ${SCENES.length}</p>
    <h2>${esc(s.title)}</h2>
    <p class="story">${esc(s.text)}</p>
    <button class="toy idle ${s.anim || "bounce"}" id="toy" aria-label="${esc(s.action)}">${sprite(s.sprite, 128)}</button>
    <p class="hint" id="hint">tap to ${esc(s.action)} <span class="count"></span></p>
    <div class="photos" id="photos" hidden></div>
    <div class="nav" id="nav" hidden><button class="pxbtn" id="next">${last ? "one last thing ♡" : "next stop →"}</button></div>`;

  let taps = 0;
  const toy = $("#toy");
  toy.onclick = e => {
    taps++;
    toy.classList.remove("idle");
    replay(toy);
    blip(500 + Math.min(taps, 6) * 110);
    const [x, y] = eventPoint(e, toy);
    popText(s.pops[Math.min(taps, s.pops.length) - 1], x, y);
    if (s.flash) flash();
    if (taps < s.taps) $("#hint .count").textContent = `(${taps}/${s.taps})`;
    if (taps === s.taps) revealPhotos(s);
  };
  $("#next").onclick = () => {
    current++;
    renderTrail();
    if (current < SCENES.length) { renderScene(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else { melody([523, 659, 784]); show("ending"); }
  };
}

function revealPhotos(s) {
  $("#hint").textContent = "♡";
  const box = $("#photos");
  box.innerHTML = s.photos.map((p, i) => `
    <figure class="polaroid" role="button" tabindex="0" style="--r:${(i % 2 ? 1 : -1) * (1.5 + (i % 3))}deg; --d:${i * 0.15}s"
      data-src="${esc(p.src)}" data-cap="${esc(p.caption || "")}">
      <img src="${esc(p.src)}" alt="${esc(p.caption || "a photo from our date")}" loading="lazy">
      <figcaption>${esc(p.caption || "")}</figcaption>
    </figure>`).join("");
  box.querySelectorAll("img").forEach(img => img.onerror = () => {
    img.outerHTML = `<div class="ph">${sprite("cat", 48)}<span>add photo:<br>${esc(img.getAttribute("src"))}</span></div>`;
  });
  box.querySelectorAll(".polaroid").forEach(f => {
    const open = () => { if (f.querySelector("img")) openLightbox(f.dataset.src, f.dataset.cap); };
    f.onclick = open;
    f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
  box.hidden = false;
  $("#nav").hidden = false;
  melody([659, 784, 988]);
  setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "start" }), 250);
}

function openLightbox(src, cap) {
  $("#lbImg").src = src; $("#lbImg").alt = cap; $("#lbCap").textContent = cap;
  $("#lightbox").hidden = false;
}
$("#lightbox").onclick = () => $("#lightbox").hidden = true;
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lightbox").hidden = true; });

/* ======================= ending ======================= */
$("#envelope").innerHTML = sprite("envelope", 128);
$("#envelope").onclick = () => {
  $("#envelope").hidden = true; $("#envHint").hidden = true;
  $("#letter").innerHTML = CONFIG.letter.map(p => `<p>${esc(p)}</p>`).join("")
    + `<p class="sign">love, ${esc(CONFIG.yourName)} ♡</p>`;
  $("#letter").hidden = false;
  melody([784, 659, 784, 1046]);
  setTimeout(() => { $("#again").hidden = false; }, 1200);
};
document.querySelectorAll("[data-yes]").forEach(b => b.onclick = () => {
  heartBurst(); melody([523, 659, 784, 1046, 1318]);
  $("#again").hidden = true; $("#final").hidden = false;
});
$("#restart").onclick = () => {
  current = 0;
  $("#envelope").hidden = false; $("#envHint").hidden = false;
  $("#letter").hidden = true; $("#again").hidden = true; $("#final").hidden = true;
  show("start");
};

/* ======================= setup ======================= */
document.querySelectorAll(".her").forEach(el => el.textContent = CONFIG.herName);
$("#dateLabel").textContent = CONFIG.dateLabel;
$("#intro").textContent = CONFIG.intro;
$("#heroCats").innerHTML = sprite("cat", 72) + sprite("heart", 28) + sprite("catOrange", 72);
$("#walker").innerHTML = sprite("cat", 28);
$("#startBtn").onclick = () => {
  melody([523, 659, 784]);
  renderTrail(); renderScene(); show("journey");
};
$("#sound").onclick = () => {
  soundOn = !soundOn;
  $("#sound").textContent = "sound: " + (soundOn ? "on" : "off");
  $("#sound").setAttribute("aria-pressed", soundOn);
};

const floaters = $("#floaters");
for (let i = 0; i < 14; i++) {
  const f = document.createElement("span");
  f.innerHTML = sprite(i % 3 ? "heart" : "paw", 14 + Math.random() * 14);
  f.style.left = Math.random() * 100 + "%";
  f.style.animationDuration = 14 + Math.random() * 14 + "s";
  f.style.animationDelay = -Math.random() * 28 + "s";
  floaters.appendChild(f);
}
</script>
</body>
</html>
