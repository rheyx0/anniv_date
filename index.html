<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ede0;
    --bg2: #f1e4d2;
    --card: #fffaf2;
    --ink: #5b4636;
    --muted: #9c8571;
    --pink: #f6b8c8;
    --pink-d: #ee8fa8;
    --pink-l: #fde6ec;
    --px: 4px;
    --paw: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='-1 -1 7 7' shape-rendering='crispEdges'><path fill='%23ee8fa8' stroke='%235b4636' stroke-width='.35' d='M1 0h1v1H1zM3 0h1v1H3zM0 1h1v1H0zM4 1h1v1H4zM1 2h3v1H1zM0 3h5v1H0zM1 4h3v1H1z'/></svg>") 11 11;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "Pixelify Sans", monospace;
    background: var(--bg);
    background-image: repeating-conic-gradient(var(--bg) 0 25%, var(--bg2) 0 50%);
    background-size: 40px 40px;
    overflow-x: hidden;
    font-variant-ligatures: none;
    cursor: var(--paw), auto;
    -webkit-tap-highlight-color: transparent;
  }
  button, .polaroid, .court { cursor: var(--paw), pointer; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px 160px; position: relative; z-index: 1; }
  h1, h2 { font-weight: 600; margin: 0 0 8px; line-height: 1.2; }
  h1 { font: 400 clamp(26px, 8vw, 40px)/1.3 "Press Start 2P", monospace; margin: 6px 0 12px; }
  h2 { font-size: clamp(24px, 6vw, 32px); }
  p { line-height: 1.5; }
  [hidden] { display: none !important; }

  /* pixel-notched box */
  .px {
    background: var(--card);
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      var(--px) calc(3 * var(--px)) 0 0 rgba(91, 70, 54, .18);
    margin: var(--px);
  }
  .card { padding: 30px 22px; text-align: center; position: relative; margin-top: 40px; }
  /* cat ears sitting on top of every card */
  .ears {
    position: absolute; left: 0; right: 0; top: -30px; height: 30px;
    display: flex; justify-content: space-between; padding: 0 16%; pointer-events: none;
  }
  .ears svg { display: block; }

  .pxbtn {
    font: 600 18px "Pixelify Sans", monospace;
    color: var(--ink);
    background: var(--pink);
    border: 0;
    padding: 12px 22px;
    margin: 8px;
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--ink),
      0 var(--px) 0 0 var(--ink),
      calc(-1 * var(--px)) 0 0 0 var(--ink),
      var(--px) 0 0 0 var(--ink),
      inset 0 calc(-1 * var(--px)) 0 0 var(--pink-d);
    transition: transform .08s;
  }
  .pxbtn:hover { background: #f8c6d3; }
  .pxbtn:active { transform: translateY(3px); }
  .pxbtn.big { font-size: 22px; padding: 14px 28px; }
  .pxbtn:focus-visible, .toy:focus-visible, .linkbtn:focus-visible, .back:focus-visible, .court:focus-visible, .jamiel:focus-visible {
    outline: 3px dashed var(--pink-d); outline-offset: 8px;
  }

  .toolbar { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; }
  .toolbar .pxbtn { padding: 5px 10px; font-size: 14px; margin: 4px 6px; }
  .toolbar .pxbtn[aria-pressed="false"] { background: var(--card); color: var(--muted); text-decoration: line-through; box-shadow: 0 0 0 3px var(--ink); }

  .kicker { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .story { font-family: "Gaegu", cursive; font-size: 23px; margin: 6px auto 4px; max-width: 32ch; }
  .hint { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
  .hint .count { color: var(--pink-d); }
  .back {
    position: absolute; top: 10px; left: 10px; background: none; border: 0; padding: 6px 8px;
    font: 15px "Pixelify Sans", monospace; color: var(--muted);
  }
  .back:hover { color: var(--ink); }

  /* the cats: cliz, rhey and jamiel, each with a name tag */
  .pet { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .pet svg { display: block; transform-origin: 50% 100%; }
  .pet.go svg { animation: bounce .4s ease-out; }
  .tag {
    font: 400 10px "Press Start 2P", monospace; color: var(--ink); background: var(--card);
    padding: 4px 7px 3px; box-shadow: 0 0 0 2px var(--ink); white-space: nowrap; line-height: 1;
  }
  .tag.her { background: var(--pink-l); }

  /* start screen */
  .cats { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin-bottom: 18px; }
  .cats .float-heart { align-self: center; animation: hop 1.6s steps(2) infinite; }
  .cats .pet svg { animation: hop 2.4s steps(2) infinite; }
  .cats .pet + .float-heart + .pet svg { animation-delay: -1.2s; }
  .hero p:not(.kicker) { font-family: "Gaegu", cursive; font-size: 22px; max-width: 30ch; margin: 10px auto 18px; }
  .kaomoji { color: var(--pink-d); font-size: 18px; margin-top: 10px; }

  /* paw-print trail */
  .trail-wrap { position: relative; margin: 0 4px 8px; padding-top: 40px; }
  .trail { list-style: none; display: flex; justify-content: space-between; margin: 0; padding: 0; position: relative; }
  .trail::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 50%; height: 4px; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, var(--muted) 0 8px, transparent 8px 14px);
  }
  .trail li { width: 28px; height: 20px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .dot { width: 14px; height: 14px; background: var(--card); box-shadow: 0 0 0 4px var(--ink); }
  .trail li.here .dot { background: var(--pink-d); }
  .trail li svg { display: block; }
  .trail-label { text-align: center; color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .walker {
    position: absolute; top: 0; width: 68px; display: flex; gap: 4px; align-items: flex-end;
    left: calc(14px + var(--p, 0) * (100% - 28px) - 34px);
    transition: left .9s steps(9);
  }
  .walker svg { display: block; animation: hop .5s steps(2) infinite; }
  .walker svg + svg { animation-delay: -.25s; }

  /* scene */
  .scene { text-align: center; }
  .stage { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin-top: 14px; }
  .toy {
    background: none; border: 0; padding: 6px; display: block; flex-shrink: 1; min-width: 0;
    filter: drop-shadow(4px 6px 0 rgba(91, 70, 54, .15));
  }
  .toy svg { display: block; max-width: 100%; height: auto; transform-origin: 50% 100%; }
  .toy.idle svg { animation: idle 2.4s ease-in-out infinite; }
  .toy.go.bounce svg { animation: bounce .35s ease-out; }
  .toy.go.squish svg { animation: squish .45s ease-out; }
  .toy.go.wiggle svg { animation: wiggle .4s ease-out; }

  /* basketball minigame */
  .court {
    position: relative; width: 100%; max-width: 340px; height: 280px; margin: 18px auto 4px; overflow: hidden;
    background: linear-gradient(#efe0f7, #fde6ec);
    box-shadow: 0 0 0 4px var(--ink), 4px 10px 0 4px rgba(91, 70, 54, .15);
    touch-action: manipulation; user-select: none;
  }
  .court::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 72px;
    background: repeating-conic-gradient(#f9d5df 0 25%, var(--card) 0 50%); background-size: 24px 24px; z-index: 0; }
  .hoop { position: absolute; top: 14px; left: 0; z-index: 2; }
  .ball { position: absolute; top: 0; left: 0; z-index: 1; }
  .hoop svg, .ball svg { display: block; }
  .score, .misses {
    position: absolute; bottom: 10px; z-index: 3; font: 600 16px "Pixelify Sans", monospace;
    background: var(--card); padding: 2px 10px; box-shadow: 0 0 0 3px var(--ink);
  }
  .score { right: 10px; }
  .misses { left: 10px; color: var(--muted); }
  .skip-box { margin-top: 14px; }
  .skip-msg { font-family: "Gaegu", cursive; font-size: 22px; color: var(--pink-d); margin: 0; }

  .photos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 30px 22px; margin: 34px 4px 8px;
  }
  .polaroid {
    position: relative; margin: 0;
    background: #fff; padding: 10px 10px 4px; text-align: center;
    box-shadow: 0 0 0 4px var(--ink), 6px 8px 0 4px rgba(91, 70, 54, .15);
    transform: rotate(var(--r, 0deg));
    animation: drop .5s ease-out both; animation-delay: var(--d, 0s);
  }
  .polaroid::before { /* washi tape */
    content: ""; position: absolute; top: -12px; left: 50%; width: 64px; height: 20px; z-index: 1;
    transform: translateX(-50%) rotate(-4deg);
    background: repeating-linear-gradient(90deg, rgba(246, 184, 200, .85) 0 8px, rgba(253, 230, 236, .85) 8px 16px);
  }
  .polaroid:hover { transform: rotate(0) scale(1.03); transition: transform .2s; }
  .polaroid img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--pink-l); }
  .polaroid figcaption { font-family: "Gaegu", cursive; font-size: 20px; padding: 8px 2px 6px; line-height: 1.2; }
  .nav { margin-top: 28px; }

  /* ending */
  .letter { text-align: left; padding: 26px 24px; margin-top: 26px; animation: drop .6s ease-out both;
    background: var(--card) repeating-linear-gradient(transparent 0 31px, var(--pink-l) 31px 33px); }
  .letter p { font-family: "Gaegu", cursive; font-size: 22px; margin: 0 0 14px; line-height: 33px; }
  .letter .sign { text-align: right; margin-bottom: 0; }
  .sign-luffy { display: flex; justify-content: flex-end; margin-top: 4px; }
  .sign-luffy svg { display: block; animation: hop 1s steps(2) infinite; }

  /* the whole date, in one swipeable strip */
  .recap { margin-top: 34px; animation: drop .6s ease-out both; }
  .recap h3 { font-size: 22px; font-weight: 600; margin: 0 0 2px; }
  .recap .hint { margin: 0; }
  .recap-strip {
    display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 26px 12px 22px; margin: 0 -14px; -webkit-overflow-scrolling: touch;
    scrollbar-color: var(--pink-d) transparent;
  }
  .recap-strip .polaroid { flex: 0 0 210px; scroll-snap-align: center; animation: none; }
  .recap-strip .stop-tag {
    position: absolute; top: 16px; left: 16px; z-index: 2; font: 600 12px "Pixelify Sans", monospace;
    background: var(--pink); padding: 1px 6px; box-shadow: 0 0 0 2px var(--ink);
  }

  .again { margin-top: 30px; }
  .again p { font-size: 20px; }
  .final { font-family: "Gaegu", cursive; font-size: 30px; font-weight: 700; color: var(--pink-d); }
  .linkbtn { background: none; border: 0; font: 16px "Pixelify Sans", monospace; color: var(--muted); margin-top: 30px; text-decoration: underline dotted; }

  /* overlays & effects */
  .floaters, .rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaters span { position: absolute; bottom: -40px; opacity: .45; animation: floatUp linear infinite; }
  .rain i { position: absolute; top: -20px; width: 4px; height: 14px; background: #a9c4d6; opacity: .8; animation: fall linear infinite; }
  .jamiel {
    position: fixed; left: 10px; bottom: 8px; z-index: 15; background: none; border: 0; padding: 0;
    filter: drop-shadow(3px 4px 0 rgba(91, 70, 54, .2));
  }
  .jamiel svg { animation: grumble 3s steps(2) infinite; }
  .pop {
    position: fixed; z-index: 30; pointer-events: none; font: 600 22px "Pixelify Sans", monospace; color: var(--pink-d);
    text-shadow: 2px 2px 0 var(--card); transform: translate(-50%, -50%); animation: pop 0.9s ease-out forwards; white-space: nowrap;
  }
  .burst { position: fixed; z-index: 35; pointer-events: none; left: 50%; top: 50%; animation: burst 1.2s ease-out forwards; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(91, 70, 54, .75); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .lightbox figure { margin: 0; background: #fff; padding: 12px 12px 6px; box-shadow: 0 0 0 4px var(--ink); max-width: min(92vw, 640px); text-align: center; }
  .lightbox img { max-width: 100%; max-height: 74vh; display: block; margin: 0 auto; }
  .lightbox figcaption { font-family: "Gaegu", cursive; font-size: 22px; padding: 8px 0 4px; }

  @keyframes hop { 50% { transform: translateY(-4px); } }
  @keyframes idle { 50% { transform: translateY(-6px); } }
  @keyframes grumble { 50% { transform: scale(1.03, .97); } }
  @keyframes bounce { 40% { transform: translateY(-18px) scale(1.05); } 70% { transform: translateY(0) scale(1.08, .92); } }
  @keyframes squish { 30% { transform: scale(1.35, .62); } 60% { transform: scale(.88, 1.15); } 80% { transform: scale(1.06, .95); } }
  @keyframes wiggle { 25% { transform: rotate(-10deg); } 50% { transform: rotate(9deg); } 75% { transform: rotate(-5deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px) rotate(var(--r, 0deg)); } to { opacity: 1; transform: rotate(var(--r, 0deg)); } }
  @keyframes pop { to { opacity: 0; transform: translate(-50%, -150%) scale(1.3); } }
  @keyframes floatUp { to { transform: translateY(-115vh) rotate(20deg); } }
  @keyframes fall { to { transform: translate(-30px, 110vh); } }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .floaters, .rain { display: none; }
  }
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>
<div class="rain" id="rain" hidden></div>
<div class="toolbar">
  <button class="pxbtn" id="musicBtn" aria-pressed="true">♪ music</button>
  <button class="pxbtn" id="sfxBtn" aria-pressed="true">sfx</button>
</div>
<button class="jamiel" id="jamiel" aria-label="jamiel the grumpy cat"></button>

<main>
  <section id="start" class="screen">
    <div class="px card hero" data-ears>
      <div class="cats" id="heroCats"></div>
      <p class="kicker" id="dateLabel"></p>
      <h1 id="greeting"></h1>
      <p id="intro"></p>
      <button class="pxbtn big" id="startBtn">start our date</button>
      <div class="kaomoji">ฅ^•ﻌ•^ฅ</div>
    </div>
  </section>

  <section id="journey" class="screen" hidden>
    <div class="trail-wrap" aria-hidden="true">
      <div class="walker" id="walker"></div>
      <ol class="trail" id="trail"></ol>
      <p class="trail-label" id="trailLabel"></p>
    </div>
    <div class="px card scene" id="scene"></div>
  </section>

  <section id="ending" class="screen" hidden>
    <div class="px card scene" data-ears>
      <button class="back" id="endBack">← back</button>
      <p class="kicker">last stop</p>
      <h2>goodnight, <span class="her"></span></h2>
      <p class="story">before you go... i left something for you</p>
      <div class="stage" id="endStage"></div>
      <p class="hint" id="envHint">tap to open</p>
      <article class="px letter" id="letter" hidden></article>
      <div class="recap" id="recap" hidden>
        <h3>our whole date ♡</h3>
        <p class="hint">swipe through everything →</p>
        <div class="recap-strip" id="recapStrip"></div>
      </div>
      <div class="again" id="again" hidden>
        <p>will you go on another date with me?</p>
        <button class="pxbtn" data-yes>yes</button>
        <button class="pxbtn" data-yes>YES ♡</button>
      </div>
      <p class="final" id="final" hidden>it's a date. see you soon ♡</p>
      <div><button class="linkbtn" id="restart">relive our date ↺</button></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure></div>

function sprite(name, size) {
  const rows = SPRITES[name];
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let rects = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (PALETTE[ch]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PALETTE[ch]}"/>`;
  }));
  return `<svg viewBox="0 0 ${w} ${h}" width="${size}" height="${Math.round(size * h / w)}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* ======================= sound & music ======================= */
let actx, sfxOn = true, musicOn = true, musicTimer = null, musicStep = 0, musicNext = 0, started = false;

function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, when, dur, type, vol) {
  const ctx = audio(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g).connect(ctx.destination);
  o.start(when); o.stop(when + dur + 0.02);
}
function blip(freq = 660, dur = 0.09) {
  if (!sfxOn) return;
  const ctx = audio(); if (ctx) tone(freq, ctx.currentTime, dur, "square", 0.035);
}
function melody(notes) { notes.forEach((f, i) => setTimeout(() => blip(f, 0.12), i * 110)); }

// a little 8-bit loop: C - Am - F - G
const hz = n => {
  const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]];
  return 440 * Math.pow(2, (k + (+n[n.length - 1] - 4) * 12 - 9) / 12);
};
const TUNE = [ // [note, length in eighth notes]
  ["E5",1],["G5",1],["C6",2],["B5",1],["G5",1],["E5",2],
  ["A5",1],["C6",1],["E6",2],["D6",1],["C6",1],["A5",2],
  ["F5",1],["A5",1],["C6",1],["A5",1],["G5",2],["F5",2],
  ["D5",1],["G5",1],["B5",2],["A5",2],["G5",2],
  ["E5",1],["G5",1],["C6",2],["E6",2],["D6",1],["C6",1],
  ["A5",2],["C6",1],["B5",1],["A5",2],["E5",2],
  ["F5",1],["A5",1],["C6",2],["B5",1],["D6",1],["G5",2],
  ["C6",2],["G5",1],["E5",1],["C5",2],[null,2],
];
const BASS = "C3 G3 C3 G3 A2 E3 A2 E3 F2 C3 F2 C3 G2 D3 G2 D3 C3 G3 C3 G3 A2 E3 A2 E3 F2 C3 G2 D3 C3 G3 C3 C3".split(" ");
const STEPS = Array.from({ length: 64 }, () => []);
{ let s = 0; TUNE.forEach(([n, len]) => { if (n) STEPS[s].push([hz(n), len, "square", 0.022]); s += len; }); }
BASS.forEach((n, i) => STEPS[i * 2].push([hz(n), 2, "triangle", 0.06]));
const EIGHTH = 0.21;

function scheduleMusic() {
  const ctx = audio(); if (!ctx) return;
  while (musicNext < ctx.currentTime + 0.25) {
    STEPS[musicStep % 64].forEach(([f, len, type, vol]) => tone(f, musicNext, len * EIGHTH * 0.9, type, vol));
    musicNext += EIGHTH; musicStep++;
  }
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  const ctx = audio(); if (!ctx) return;
  musicNext = ctx.currentTime + 0.1;
  musicTimer = setInterval(scheduleMusic, 60);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopMusic(); else if (started) startMusic();
});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let current = 0;
const done = new Set();

function popText(text, x, y) {
  const el = document.createElement("span");
  el.className = "pop"; el.textContent = text;
  el.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function eventPoint(e, el) {
  if (e.clientX || e.clientY) return [e.clientX, e.clientY - 30];
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top];
}
function replay(el) { el.classList.remove("go"); void el.offsetWidth; el.classList.add("go"); }
function hopPets(root) { root.querySelectorAll(".pet").forEach(replay); }
function heartBurst() {
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("span"); h.className = "burst";
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    h.style.setProperty("--dx", Math.cos(a) * d + "px");
    h.style.setProperty("--dy", Math.sin(a) * d + "px");
    h.innerHTML = sprite(Math.random() < .7 ? "heart" : "paw", 18 + Math.random() * 18);
    document.body.appendChild(h); setTimeout(() => h.remove(), 1250);
  }
}
function setRain(on) {
  const rain = $("#rain");
  if (on && !rain.childElementCount) {
    for (let i = 0; i < 45; i++) {
      const d = document.createElement("i");
      d.style.left = Math.random() * 110 + "%";
      d.style.animationDuration = 0.7 + Math.random() * 0.6 + "s";
      d.style.animationDelay = -Math.random() * 2 + "s";
      rain.appendChild(d);
    }
  }
  if (!on) rain.innerHTML = "";
  rain.hidden = !on;
}
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  if (id !== "journey") setRain(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function polaroid(p, i, extra = "") {
  return `<figure class="polaroid" role="button" tabindex="0" style="--r:${(i % 2 ? 1 : -1) * (1.5 + (i % 3))}deg"
      data-src="${esc(p.src)}" data-cap="${esc(p.caption || "")}">${extra}
      <img src="${esc(p.src)}" alt="${esc(p.caption || "a photo from our date")}" loading="lazy">
      <figcaption>${esc(p.caption || "")}</figcaption>
    </figure>`;
}
function wireLightbox(root) {
  root.querySelectorAll(".polaroid").forEach(f => {
    const open = () => openLightbox(f.dataset.src, f.dataset.cap);
    f.onclick = open;
    f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
}

function renderTrail() {
  const stops = [...SCENES.map(s => s.stop), "goodnight"];
  $("#trail").innerHTML = stops.map((s, i) =>
    `<li class="${i === current ? "here" : ""}">${i < current ? sprite("paw", 18) : '<span class="dot"></span>'}</li>`
  ).join("");
  $("#trailLabel").textContent = stops[current];
  const hat = (SCENES[current] || {}).hat;
  $("#walker").innerHTML = sprite("catBrown", 32) + sprite(hat ? "catBlackHat" : "catBlack", 32);
  $("#walker").style.setProperty("--p", current / (stops.length - 1));
}

function renderScene() {
  const s = SCENES[current];
  const last = current === SCENES.length - 1;
  setRain(s.effect === "rain");
  const play = s.game
    ? `<div class="court" id="court" tabindex="0" role="button" aria-label="shoot the ball">
         <div class="hoop" id="hoop">${sprite("hoop", 96)}</div>
         <div class="ball" id="ball">${sprite("ball", 36)}</div>
         <div class="misses" id="misses">miss: 0</div>
         <div class="score" id="score">0 / ${s.goal}</div>
       </div>
       <button class="pxbtn" id="shoot">shoot!</button>
       <div class="skip-box" id="skipBox" hidden>
         <p class="skip-msg">${esc(s.skipText)}</p>
         <button class="pxbtn" id="skip">skip</button>
       </div>
       <div class="stage">${cliz(64)}${rhey(64)}</div>`
    : `<div class="stage">
         ${cliz(64)}
         <button class="toy idle ${s.anim || "bounce"}" id="toy" aria-label="${esc(s.action)}">${sprite(s.sprite, s.size || 150)}</button>
         ${rhey(64, s.hat)}
         ${s.jamiel ? pet("jamiel", "jamiel", 64) : ""}
       </div>`;
  $("#scene").innerHTML = `${EARS}
    <button class="back" id="back">← back</button>
    <p class="kicker">stop ${current + 1} of ${SCENES.length}</p>
    <h2>${esc(s.title)}</h2>
    <p class="story">${esc(s.text)}</p>
    ${play}
    <p class="hint" id="hint">${s.game ? `tap to shoot. make ${s.goal} baskets to win a prize!` : `tap to ${esc(s.action)}`} <span class="count"></span></p>
    <div class="photos" id="photos" hidden></div>
    <div class="nav" id="nav" hidden><button class="pxbtn" id="next">${last ? "one last thing ♡" : "next stop →"}</button></div>`;
  $("#back").onclick = goBack;
  $("#next").onclick = goNext;
  if (s.game) setupGame(s); else setupToy(s);
  if (done.has(current)) revealPhotos(s, true);
}

function setupToy(s) {
  let taps = 0;
  const toy = $("#toy");
  toy.onclick = e => {
    taps++;
    toy.classList.remove("idle");
    replay(toy); hopPets($("#scene"));
    blip(500 + Math.min(taps, 6) * 110);
    const [x, y] = eventPoint(e, toy);
    popText(s.pops[Math.min(taps, s.pops.length) - 1], x, y);
    if (done.has(current)) return;
    if (taps < s.taps) $("#hint .count").textContent = `(${taps}/${s.taps})`;
    if (taps === s.taps) revealPhotos(s);
  };
}

function setupGame(s) {
  const court = $("#court"), hoop = $("#hoop"), ball = $("#ball");
  let score = 0, misses = 0, flying = false, hoopX = 0;
  const t0 = performance.now();
  const W = () => court.clientWidth, H = () => court.clientHeight;
  const restY = () => H() - 52;

  // "1000 percent difficulty": the hoop speeds up and wobbles
  (function loop(now) {
    if (!document.body.contains(court)) return;
    const amp = (W() - 96) / 2 - 4, t = (now - t0) / 1000;
    hoopX = (W() - 96) / 2 + amp * Math.sin(t * 2.6 + Math.sin(t * 1.3) * 0.8);
    hoop.style.transform = `translateX(${hoopX}px)`;
    requestAnimationFrame(loop);
  })(t0);

  function placeBall(y, scale = 1, dx = 0, opacity = 1) {
    ball.style.transform = `translate(${W() / 2 - 18 + dx}px, ${y}px) scale(${scale})`;
    ball.style.opacity = opacity;
  }
  placeBall(restY());

  function animate(ms, step, then) {
    const start = performance.now();
    (function frame(now) {
      const p = Math.min((now - start) / ms, 1);
      step(p);
      if (p < 1) requestAnimationFrame(frame); else then();
    })(start);
  }

  function shoot() {
    if (flying) return;
    flying = true; blip(440, 0.06);
    const y0 = restY(), yTop = 6;
    animate(420, p => { const e = 1 - (1 - p) * (1 - p); placeBall(y0 + (yTop - y0) * e, 1 - 0.3 * e); }, judge);
  }

  function judge() {
    const diff = (hoopX + 48) - W() / 2;
    const made = Math.abs(diff) <= 20;
    const r = ball.getBoundingClientRect();
    if (made) {
      score++;
      $("#score").textContent = `${score} / ${s.goal}`;
      popText(score >= s.goal ? "you win!! ♡" : "swish!", r.left + 18, r.top);
      melody([784, 988]);
    } else {
      misses++;
      $("#misses").textContent = `miss: ${misses}`;
      popText("miss!", r.left + 18, r.top);
      blip(196, 0.15);
      if (misses >= s.skipAfter && !done.has(current)) $("#skipBox").hidden = false;
    }
    const side = diff > 0 ? -1 : 1;
    animate(380,
      p => placeBall(6 + p * (made ? 80 : 150), 0.7, made ? 0 : side * p * 70, 1 - p),
      () => {
        placeBall(restY()); flying = false;
        if (made && score === s.goal) {
          heartBurst(); hopPets($("#scene"));
          $("#skipBox").hidden = true;
          if (!done.has(current)) revealPhotos(s);
        }
      });
  }

  court.onclick = shoot;
  court.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); shoot(); } };
  $("#shoot").onclick = shoot;
  $("#skip").onclick = () => { $("#skipBox").hidden = true; revealPhotos(s); };
}

function revealPhotos(s, quiet) {
  done.add(current);
  $("#hint").textContent = "♡";
  const box = $("#photos");
  box.innerHTML = s.photos.map((p, i) => polaroid(p, i)).join("");
  if (!quiet) box.querySelectorAll(".polaroid").forEach((f, i) => f.style.setProperty("--d", i * 0.15 + "s"));
  wireLightbox(box);
  box.hidden = false;
  $("#nav").hidden = false;
  if (!quiet) {
    melody([659, 784, 988]);
    setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "start" }), 250);
  }
}

function goNext() {
  current++;
  if (current < SCENES.length) { renderTrail(); renderScene(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else { melody([523, 659, 784]); show("ending"); }
}
function goBack() {
  if (current === 0) { show("start"); return; }
  current--;
  renderTrail(); renderScene();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openLightbox(src, cap) {
